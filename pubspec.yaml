name: mis_listas
description: Listas personalizadas con presupuesto, estadisticas y mas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^13.3.3
  record: ^7.2.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  open_filex: ^5.0.0
  table_calendar: ^3.1.2
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "app_icon.png"
  android: true
  windows:
    generate: true
  min_sdk_android: 21